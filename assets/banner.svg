<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="glassFill" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="blurGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/></filter><filter id="dropShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-15px) translateX(10px)}}@keyframes scanline{0%{transform:translateY(0);opacity:.2}50%{opacity:.6}}@keyframes codePulse{0%{opacity:.3}50%{opacity:.9}}.bg-glow-1{animation:pulseGlow 8s infinite ease-in-out;transform-origin:200px 100px}.bg-glow-2{animation:pulseGlow 10s infinite ease-in-out 2s;transform-origin:1000px 260px}.particle-1{animation:floatParticle 6s infinite ease-in-out}.particle-2{animation:floatParticle 8s infinite ease-in-out 1s}.particle-3{animation:floatParticle 7s infinite ease-in-out 3s}.code-glow{animation:codePulse 3s infinite ease-in-out}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.code-text{font-family:&apos;Fira Code&apos;,&apos;JetBrains Mono&apos;,Consolas,Monaco,monospace;font-size:13px;fill:#a7f3d0}</style><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><circle cx="200" cy="90" r="140" fill="#6366f1" class="bg-glow-1" filter="url(#blurGlow)" opacity=".3"/><circle cx="1000" cy="270" r="160" fill="#ec4899" class="bg-glow-2" filter="url(#blurGlow)" opacity=".25"/><circle cx="600" cy="180" r="120" fill="#06b6d4" filter="url(#blurGlow)" opacity=".2"/><g stroke="#fff" stroke-width="1" opacity=".08"><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" d="M 40 0 L 0 0 0 40"/></pattern><rect width="1200" height="360" fill="url(#grid)"/></g><g filter="url(#dropShadow)" transform="translate(740, 45)"><rect width="410" height="270" fill="url(#glassFill)" stroke="#fff" stroke-opacity=".15" stroke-width="1" rx="12"/><rect width="410" height="36" fill="#0f172a" fill-opacity=".6" rx="12"/><circle cx="20" cy="18" r="5" fill="#ef4444"/><circle cx="36" cy="18" r="5" fill="#f59e0b"/><circle cx="52" cy="18" r="5" fill="#10b981"/><text x="75" y="22" fill="#64748b" font-family="monospace" font-size="11">editor.config.ts — Awesome Editor</text><text x="24" y="70" class="code-text"><tspan fill="#f472b6">import</tspan> { <tspan fill="#38bdf8">CodeEditor</tspan>, <tspan fill="#38bdf8">AIAssistant</tspan> } <tspan fill="#f472b6">from</tspan> <tspan fill="#fde047">&apos;@awesome/ide&apos;</tspan>;</text><text x="24" y="98" class="code-text"><tspan fill="#f472b6">const</tspan> <tspan fill="#60a5fa">editor</tspan> = <tspan fill="#f472b6">new</tspan> <tspan fill="#38bdf8">CodeEditor</tspan>({</text><text x="44" y="124" class="code-text">theme: <tspan fill="#fde047">&apos;tokyo-night&apos;</tspan>,</text><text x="44" y="150" class="code-text">lsp: [ <tspan fill="#fde047">&apos;rust&apos;</tspan>, <tspan fill="#fde047">&apos;python&apos;</tspan>, <tspan fill="#fde047">&apos;typescript&apos;</tspan> ],</text><text x="44" y="176" class="code-text">ai: <tspan fill="#f472b6">new</tspan> <tspan fill="#38bdf8">AIAssistant</tspan>({ mode: <tspan fill="#fde047">&apos;autonomous&apos;</tspan> }),</text><text x="44" y="202" class="code-text">performance: <tspan fill="#fde047">&apos;gpu-accelerated&apos;</tspan></text><text x="24" y="228" class="code-text">});</text><text x="24" y="254" class="code-text"><tspan fill="#60a5fa">editor</tspan>.<tspan fill="#38bdf8">launch</tspan>(); <tspan fill="#64748b" class="code-glow">// ✨ Instant productivity</tspan></text></g><g><g transform="translate(60, 0) translate(0, 52)"><rect width="260" height="30" fill="#0369a1" fill-opacity=".3" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="15"/><circle cx="15" cy="15" r="4" fill="#38bdf8" class="code-glow"/><text x="28" y="20" class="badge-text">⚡ CURATED DEVELOPER ECOSYSTEM</text></g><text x="0" y="140" class="title-text" transform="translate(60, 0)">Awesome Source Code</text><text x="0" y="192" fill="url(#primaryGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" transform="translate(60, 0)">Editors &amp; IDEs 🚀</text><text x="0" y="235" class="subtitle-text" transform="translate(60, 0)">A comprehensive guide to SaaS platforms, Open-Source IDEs,</text><text x="0" y="262" class="subtitle-text" transform="translate(60, 0)">modal editors, and AI-native coding assistants.</text><g transform="translate(60, 0) translate(0, 290)"><rect width="110" height="28" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="6"/><text x="12" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🤖 AI-Native</text><rect width="125" height="28" x="120" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="6"/><text x="132" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🔓 Open Source</text><rect width="125" height="28" x="255" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="6"/><text x="267" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">⌨️ Modal Editing</text></g></g><circle cx="100" cy="40" r="3" fill="#38bdf8" class="particle-1"/><circle cx="680" cy="310" r="4" fill="#a855f7" class="particle-2"/><circle cx="1160" cy="80" r="2" fill="#ec4899" class="particle-3"/></svg>