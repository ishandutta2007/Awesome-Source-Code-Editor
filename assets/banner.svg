<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glassmorphism Card Fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.4; transform: scale(1); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(340px); opacity: 0.2; }
    }
    @keyframes codePulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }

    .bg-glow-1 { animation: pulseGlow 8s infinite ease-in-out; transform-origin: 200px 100px; }
    .bg-glow-2 { animation: pulseGlow 10s infinite ease-in-out 2s; transform-origin: 1000px 260px; }
    .particle-1 { animation: floatParticle 6s infinite ease-in-out; }
    .particle-2 { animation: floatParticle 8s infinite ease-in-out 1s; }
    .particle-3 { animation: floatParticle 7s infinite ease-in-out 3s; }
    .scan-effect { animation: scanline 5s infinite linear; }
    .code-glow { animation: codePulse 3s infinite ease-in-out; }

    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .code-text {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      fill: #a7f3d0;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>

  <!-- Animated Glowing Orbs (Background Layer) -->
  <circle cx="200" cy="90" r="140" fill="#6366f1" opacity="0.3" filter="url(#blurGlow)" class="bg-glow-1"/>
  <circle cx="1000" cy="270" r="160" fill="#ec4899" opacity="0.25" filter="url(#blurGlow)" class="bg-glow-2"/>
  <circle cx="600" cy="180" r="120" fill="#06b6d4" opacity="0.2" filter="url(#blurGlow)"/>

  <!-- Grid Pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>

  <!-- Right Decorative Glass Code Window (Background-Right) -->
  <g transform="translate(740, 45)" filter="url(#dropShadow)">
    <rect width="410" height="270" rx="12" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Window Header -->
    <rect width="410" height="36" rx="12" fill="#0f172a" fill-opacity="0.6"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="75" y="22" font-family="monospace" font-size="11" fill="#64748b">editor.config.ts — Awesome Editor</text>

    <!-- Code Snippet Lines -->
    <text x="24" y="70" class="code-text"><tspan fill="#f472b6">import</tspan> { <tspan fill="#38bdf8">CodeEditor</tspan>, <tspan fill="#38bdf8">AIAssistant</tspan> } <tspan fill="#f472b6">from</tspan> <tspan fill="#fde047">'@awesome/ide'</tspan>;</text>
    <text x="24" y="98" class="code-text"><tspan fill="#f472b6">const</tspan> <tspan fill="#60a5fa">editor</tspan> = <tspan fill="#f472b6">new</tspan> <tspan fill="#38bdf8">CodeEditor</tspan>({</text>
    <text x="44" y="124" class="code-text">theme: <tspan fill="#fde047">'tokyo-night'</tspan>,</text>
    <text x="44" y="150" class="code-text">lsp: [ <tspan fill="#fde047">'rust'</tspan>, <tspan fill="#fde047">'python'</tspan>, <tspan fill="#fde047">'typescript'</tspan> ],</text>
    <text x="44" y="176" class="code-text">ai: <tspan fill="#f472b6">new</tspan> <tspan fill="#38bdf8">AIAssistant</tspan>({ mode: <tspan fill="#fde047">'autonomous'</tspan> }),</text>
    <text x="44" y="202" class="code-text">performance: <tspan fill="#fde047">'gpu-accelerated'</tspan></text>
    <text x="24" y="228" class="code-text">});</text>
    <text x="24" y="254" class="code-text"><tspan fill="#60a5fa">editor</tspan>.<tspan fill="#38bdf8">launch</tspan>(); <tspan fill="#64748b" class="code-glow">// ✨ Instant productivity</tspan></text>
  </g>

  <!-- Left Foreground Content (CLEAR & UNHEEDED BY ANY DYNAMIC ELEMENT) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="260" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#38bdf8" class="code-glow"/>
      <text x="28" y="20" class="badge-text">⚡ CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title-text">
      Awesome Source Code
    </text>
    <text x="0" y="192" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" fill="url(#primaryGlow)">
      Editors &amp; IDEs 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle-text">
      A comprehensive guide to SaaS platforms, Open-Source IDEs,
    </text>
    <text x="0" y="262" class="subtitle-text">
      modal editors, and AI-native coding assistants.
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 290)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🤖 AI-Native</text>

      <!-- Tag 2 -->
      <rect x="120" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="132" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔓 Open Source</text>

      <!-- Tag 3 -->
      <rect x="255" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="267" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⌨️ Modal Editing</text>
    </g>
  </g>

  <!-- Floating Particles for subtle dynamic aspect -->
  <circle cx="100" cy="40" r="3" fill="#38bdf8" class="particle-1"/>
  <circle cx="680" cy="310" r="4" fill="#a855f7" class="particle-2"/>
  <circle cx="1160" cy="80" r="2" fill="#ec4899" class="particle-3"/>
</svg>
